name: MintHRM pipeline continue

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  lint:
    runs-on: ubuntu-22.04  # Use a compatible Ubuntu version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black
        run: |
          black .
          black --check .

      # - name: Run MyPy
      #   run: |
      #     mypy --install-types --non-interactive .
      #     mypy .

      - name: Run Pylint
        run: pylint app/main.py


  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'  
      - run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: PYTHONPATH=$(pwd) pytest tests/ --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html


    

      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip test

      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests.py --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html

      
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the code linting and formatting tool Ruff
        run: pipx install ruff
      - name: Lint code with Ruff
        run: ruff check --output-format=github --target-version=py39
      - name: Check code formatting with Ruff
        run: ruff format --diff --target-version=py39
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install pip and pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Test with pytest
        run: pytest tests.py --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}.xml
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        # with:
        #   name: pytest-results-${{ matrix.python-version }}
        #   path: junit/test-results-${{ matrix.python-version }}.xml
        # # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  config:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create docker IMAGE
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}:latest .
          docker push ${{ env.REGISTRY_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      - name: Set Environment Name
        run: echo "CI_ENVIRONMENT_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Deploy to Server (Dev Environment)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/
            ./${{ vars.DEPLOY_SCRIPT }} \
              -v "latest" \
              -a "${{ vars.CONTAINER_TAG }}"
              -u "${{ secrets.DOCKER_USERNAME }}" \
              -p "${{ secrets.DOCKER_PASSWORD }}" \
              -l "/var/www/${{ vars.DEPLOY_PATH }}" \
              -r "docker.io"
        env:
          CONTAINER_TAG: ${{ vars.CONTAINER_TAG }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
